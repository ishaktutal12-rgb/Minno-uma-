<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Özür Dilerim - Seni Seviyorum</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle, #ffe6eb 0%, #ffb3c1 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            text-align: center;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Kalp Şekli */
        .heart {
            position: relative;
            width: 260px;
            height: 260px;
            background-color: #ff2a5f;
            margin: 100px auto 40px auto;
            transform: rotate(-45deg);
            box-shadow: 0 0 40px rgba(255, 42, 95, 0.5);
            animation: pulse 1.3s infinite ease-in-out;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .heart::before,
        .heart::after {
            content: "";
            position: absolute;
            width: 260px;
            height: 260px;
            background-color: #ff2a5f;
            border-radius: 50%;
        }

        .heart::before {
            top: -130px;
            left: 0;
        }

        .heart::after {
            left: 130px;
            top: 0;
        }

        /* Kalp İçindeki Yazı */
        .text-container {
            position: absolute;
            z-index: 10;
            transform: rotate(45deg);
            color: #ffffff;
            text-align: center;
            width: 220px;
            pointer-events: none;
        }

        .text-container h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.25);
            line-height: 1.3;
        }

        .text-container p {
            font-size: 20px;
            font-weight: 600;
            text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.25);
        }

        .music-player {
            width: 100%;
            max-width: 320px;
            margin-top: 80px;
            z-index: 20;
        }

        /* Kalp Atış Animasyonu */
        @keyframes pulse {
            0% {
                transform: rotate(-45deg) scale(1);
            }
            14% {
                transform: rotate(-45deg) scale(1.08);
            }
            28% {
                transform: rotate(-45deg) scale(1);
            }
            42% {
                transform: rotate(-45deg) scale(1.08);
            }
            70% {
                transform: rotate(-45deg) scale(1);
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="heart">
            <div class="text-container">
                <h1>Özür Dilerim</h1>
                <p>Seni Seviyorum ❤️️</p>
            </div>
        </div>

        <!-- Spotify Müzik Çalar -->
        <div class="music-player">
            <iframe 
                style="border-radius:12px" 
                src="https://open.spotify.com/embed/track/6cjIlxXM1ca6nxkJ0p27jU" 
                width="100%" 
                height="152" 
                frameBorder="0" 
                allowfullscreen="" 
                allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" 
                loading="lazy">
            </iframe>
        </div>
    </div>

</body>
</html>
