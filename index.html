<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Özür Dilerim - Seni Seviyorum</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle, #ffe6eb 0%, #ffb3c1 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        .container {
            text-align: center;
            position: relative;
        }

        /* Kalp Şekli */
        .heart {
            position: relative;
            width: 280px;
            height: 280px;
            background-color: #ff2a5f;
            margin: 0 auto;
            transform: rotate(-45deg);
            box-shadow: 0 0 40px rgba(255, 42, 95, 0.5);
            animation: pulse 1.3s infinite ease-in-out;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .heart::before,
        .heart::after {
            content: "";
            position: absolute;
            width: 280px;
            height: 280px;
            background-color: #ff2a5f;
            border-radius: 50%;
        }

        .heart::before {
            top: -140px;
            left: 0;
        }

        .heart::after {
            left: 140px;
            top: 0;
        }

        /* Kalp İçindeki Yazı */
        .text-container {
            position: absolute;
            z-index: 10;
            transform: rotate(45deg);
            color: #ffffff;
            text-align: center;
            width: 240px;
            pointer-events: none;
        }

        .text-container h1 {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 8px;
            text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.25);
            line-height: 1.3;
        }

        .text-container p {
            font-size: 22px;
            font-weight: 600;
            text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.25);
        }

        /* Kalp Atış Animasyonu */
        @keyframes pulse {
            0% {
                transform: rotate(-45deg) scale(1);
            }
            14% {
                transform: rotate(-45deg) scale(1.08);
            }
            28% {
                transform: rotate(-45deg) scale(1);
            }
            42% {
                transform: rotate(-45deg) scale(1.08);
            }
            70% {
                transform: rotate(-45deg) scale(1);
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="heart">
            <div class="text-container">
                <h1>Özür Dilerim</h1>
                <p>Seni Seviyorum ❤️</p>
            </div>
        </div>
    </div>

</body>
</html>
